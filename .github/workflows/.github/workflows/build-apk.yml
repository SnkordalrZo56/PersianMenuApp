name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unzip Android project
        run: unzip -q PersianMenuApp-fixed.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: PersianMenuApp
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PersianMenuApp-debug-apk
          path: PersianMenuApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
